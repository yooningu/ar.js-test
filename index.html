<div id="scanning" class="hidden" style="text-align: center;">
  <canvas id="custom-loading" width="400" height="800" style="
    pointer-events: none;
    background: transparent;
    display: block;
    margin: 0 auto;
  "></canvas>

</div>

<script>
  const frameCount = 90; // 전체 프레임 수
  const frameBase = "https://yooningu.github.io/ar.js-test/webm/uiui_"; // 파일 경로
  const frameRate = 30; // FPS (1초에 30프레임)

  const canvas = document.getElementById("custom-loading");
  const ctx = canvas.getContext("2d");
  const images = [];
  let currentFrame = 0;

  // 이미지 미리 로드
  for (let i = 0; i < frameCount; i++) {
    const img = new Image();
    img.src = `${frameBase}${i.toString().padStart(5, '0')}.png`;
    images.push(img);
  }

  // 반복 재생 애니메이션
  function animate() {
    setTimeout(() => {
      requestAnimationFrame(animate);
      const img = images[currentFrame];
      if (img.complete) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      }
      currentFrame = (currentFrame + 1) % frameCount; // 🎯 반복
    }, 1000 / frameRate);
  }

  animate(); // 실행
</script>
