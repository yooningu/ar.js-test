 <style>
      #scanning.hidden {
        display: none;
      }
      
      
  </style>

  <body>

<div id="scanning" class="hidden" style="text-align: center;">
  <canvas id="custom-loading" width="400" height="800" style="
    pointer-events: none;
    background: transparent;
    display: block;
    margin: 0 auto;
  "></canvas>
  <p style="margin-top: 12px;">📷 스캔 중입니다... 마법의 순간을 기다려주세요!</p>
</div>

<script>
  const frameCount = 73; // 전체 프레임 수
  const frameBase = "./webm/ui/ui_"; // 파일 경로
  const frameRate = 30; // FPS (1초에 30프레임)

  const canvas = document.getElementById("custom-loading");
  const ctx = canvas.getContext("2d");
  const images = [];
  let currentFrame = 0;

  // 이미지 미리 로드
  for (let i = 0; i < frameCount; i++) {
    const img = new Image();
    img.src = `${frameBase}${i.toString().padStart(5, '0')}.png`;
    images.push(img);
  }

  // 반복 재생 애니메이션
  function animate() {
    setTimeout(() => {
      requestAnimationFrame(animate);
      const img = images[currentFrame];
      if (img.complete) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      }
      currentFrame = (currentFrame + 1) % frameCount; // 🎯 반복
    }, 1000 / frameRate);
  }

  animate(); // 실행
</script>
<script>
  AFRAME.registerComponent('play-video-on-target', {
    init() {
      const video = document.querySelector('#cardVideo');
      const anchor = this.el;
      anchor.addEventListener('targetFound', () => {
        video.play().catch(() => {});
      });
      anchor.addEventListener('targetLost', () => {
        video.pause();
      });
    }
  });
</script>


      
<div id="header">PixiToy</div>
 

         <!-- 판타지 느낌 아이콘  -->
 <a-scene

  renderer=" colorManagement: true; physicallyCorrectLights: true; antialias: true"

<!-- ---------------------------------------------------------------------------------------          ---모델 넣는 곳 -->



    <a-entity mindar-image-target="targetIndex: 0">

<a-entity light="type: directional; intensity: 0.5; color: #ffffff" position="0 -1 -1"></a-entity>

<!-- 주변광 -->

</a-scene>
