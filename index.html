  <head>
    <title>ingu's joljak</title>

      // 도넛 로딩 숨기기기
  document.addEventListener("DOMContentLoaded", () => {
  const mindarContainer = document.querySelector(".mindar-ui-loading");
  if (mindarContainer) mindarContainer.style.display = "none";
});
</script>

    <div id="loading">

</div>

      
<div id="header">PixiToy</div>
 

         <!-- 판타지 느낌 아이콘  -->
 <a-scene mindar-image="imageTargetSrc: https://yooningu.github.io/ar.js-test/nft/logo-p1.mind;filterMinCF:0.0001;filterBeta:0.01" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <a-entity mindar-image-target="targetIndex: 0">

</a-scene>
