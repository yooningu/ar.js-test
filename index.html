<html>
  <head>
    <title>ingu's joljak</title>
    <link rel="stylesheet" href="index.css" />

    <link rel="icon" href="https://yooningu.github.io/ar.js-test/svg/favicon.ico" /> 
    <link rel="apple-touch-icon" href="https://yooningu.github.io/ar.js-test/svg/favicon.ico">

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>
  



  <body>

    <div id="loading">
  <img src="https://yooningu.github.io/ar.js-test/svg/cat-loading.svg" alt="로딩 아이콘" id="cat-loading" />
  <p>마법을 준비 중...</p>
</div>

      
<div id="header">PixiToy</div>
 

         <!-- 판타지 느낌 아이콘  -->
 <a-scene 
  mindar-image="imageTargetSrc: https://yooningu.github.io/ar.js-test/mind/test1.mind;filterMinCF:0.0001;filterBeta:0.01; uiLoading: no; maxTrack: 10" 
  color-space="sRGB" 
  renderer="colorManagement: true, physicallyCorrectLights" 
  vr-mode-ui="enabled: false" 
  device-orientation-permission-ui="enabled: false">
<!-- uiError: no; uiLoading: no 스켄이랑 에러 화면 숨기기 -->


  <a-assets>
<!-- <a-asset-item id="avatarModel" src="https://cdn.jsdelivr.net/gh/yooningu/ar.js-test@main/gltf/logo-p1/logo-p1.gltf" /> -->
  <a-asset-item id="logo" src="https://cdn.jsdelivr.net/gh/yooningu/ar.js-test@main/gltf/logo-p1/logo-p1.gltf" />
    <a-asset-item id="test" src="https://yooningu.github.io/ar.js-test/gltf/nanachi/scene.gltf" />
    <!-- 모델 분류 하는 곳 id: 객체 이름, src: 경로 -->
  </a-assets>
  <!-- mind 객체 탐지 준비 -->

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>





<!-- ------------------------------------------------------------------------------------------모델 넣는 곳 -->
  <a-entity mindar-image-target="targetIndex: 0">
    <!-- <img id="card" src="https://yooningu.github.io/ar.js-test/images/test.jpg" />
    <a-plane src="#card" position="0 0 0" height="0.552" width="1" rotation="0 0 0"></a-plane> 사진 넣을 때-->
    <a-gltf-model rotation="0 0 0 " position="0 0 0.2" scale="5 5 5" src="#logo"/>
    <!-- mindar-image-target에 각각 번호 부여

    사진을 정면으로 봤을 때 0 1 2 라고 치면 
    1은 세로로 그니깐 상단쪽이 하늘을 보게 됨 
    2는 반시계로 돎 
    -->
  </a-entity>

<a-entity mindar-image-target="targetIndex: 1">
    <!-- <img id="card" src="https://yooningu.github.io/ar.js-test/images/test.jpg" />
    <a-plane src="#card" position="0 0 0" height="0.552" width="1" rotation="0 0 0"></a-plane> 사진 넣을 때-->
    <a-gltf-model rotation="90 0 90 " position="0 0 0.2" scale="0.1 0.1 0.1" src="#test"/>
    <!-- 사진을 정면으로 봤을 때 0 1 2 라고 치면 
    1은 세로로 그니깐 상단쪽이 하늘을 보게 됨됨 
    2는 반시계로 돎돎 -->
  </a-entity>

</a-scene>









<script>
  const loading = document.getElementById("loading");

  // scanning UI가 나타나는지 감지하는 관찰자
  const observer = new MutationObserver(() => {
    const scanningUI = document.querySelector(".mindar-ui-scanning");
    if (scanningUI && scanningUI.style.display !== "none") {
      if (loading) {
        loading.style.setProperty("display", "none", "important");
        observer.disconnect(); // 감지 끝내기
      }
    }
  });

  // body 전체를 감시하되, DOM 추가가 있을 때만 반응
  observer.observe(document.body, { childList: true, subtree: true });
</script>

</html>
