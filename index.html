<script>
  document.addEventListener("DOMContentLoaded", () => {
    const assets = document.querySelector("a-assets");
    const loading = document.getElementById("loading");

    if (assets) {
      assets.addEventListener("loaded", () => {
        if (loading) loading.style.display = "none";
      });
    }
  });
</script>

  </head>
  



  <body>

    <div id="loading">
  <img src="https://yooningu.github.io/ar.js-test/svg/cat-loading.svg" alt="로딩 아이콘" id="cat-loading" />
  <p>마법을 준비 중...</p>
</div>

      
<div id="header">PixiToy</div>
 

         <!-- 판타지 느낌 아이콘  -->
 <a-scene 
  mindar-image="imageTargetSrc: https://yooningu.github.io/ar.js-test/nft/logo-p1.mind;filterMinCF:0.0001;filterBeta:0.01; uiLoading: #loading;" 
  color-space="sRGB" 
  renderer="colorManagement: true, physicallyCorrectLights" 
  vr-mode-ui="enabled: false" 
  device-orientation-permission-ui="enabled: false">
<!-- uiError: no; uiLoading: no 스켄이랑 에러 화면 숨기기 -->


  <a-assets>
<a-asset-item id="avatarModel" src="https://cdn.jsdelivr.net/gh/yooningu/ar.js-test@main/glb/logo-p1/logo-p1.gltf" />
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <a-entity mindar-image-target="targetIndex: 0">
    <!-- <img id="card" src="https://yooningu.github.io/ar.js-test/images/test.jpg" />
    <a-plane src="#card" position="0 0 0" height="0.552" width="1" rotation="0 0 0"></a-plane> 사진 넣을 때-->
    <a-gltf-model rotation="0 0 0 " position="0 0 0.2" scale="5 5 5" src="#avatarModel"/>


  </a-entity>
</a-scene>
